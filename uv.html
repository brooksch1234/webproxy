<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BW Nexus · Ultraviolet</title>
<style>
	:root { --bg:#070912; --line:#1d2337; --text:#e8ecf7; --muted:#8b95ad; --accent:#8b7bff; }
	* { box-sizing: border-box; }
	html, body { height:100%; margin:0; background:var(--bg); color:var(--text);
		font:15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
	header { display:flex; align-items:center; gap:10px; padding:10px 14px;
		border-bottom:1px solid var(--line); background:linear-gradient(180deg,#0d1120,#0a0d18); }
	.brand { font-weight:700; letter-spacing:.14em; font-size:13px; text-transform:uppercase; color:#c9d2ea; white-space:nowrap; }
	.brand b { color:var(--accent); }
	button, .link { appearance:none; border:1px solid var(--line); background:#111627; color:var(--text);
		border-radius:9px; padding:7px 10px; font:inherit; font-size:13px; cursor:pointer; text-decoration:none; }
	button:disabled { opacity:.4; cursor:default; }
	form { flex:1; display:flex; gap:8px; min-width:0; }
	input { flex:1; min-width:0; background:#0b0f1c; border:1px solid var(--line); color:var(--text);
		border-radius:9px; padding:8px 11px; font:inherit; font-size:14px; }
	input:focus { outline:none; border-color:#3c4570; box-shadow:0 0 0 3px #20263f; }
	#status { font-size:12px; color:var(--muted); white-space:nowrap; }
	#status[data-state="online"] { color:#57d995; }
	#status[data-state="offline"] { color:#ff7b7b; }
	main { position:absolute; inset:53px 0 0; }
	iframe { width:100%; height:100%; border:0; background:#fff; }
	#banner { position:absolute; left:12px; right:12px; bottom:12px; background:#1a1020;
		border:1px solid #43233f; color:#ffd7e6; padding:10px 12px; border-radius:10px;
		font-size:13px; display:none; }
	#banner.show { display:block; }
</style>
</head>
<body>
<header>
	<span class="brand"><b>BW</b> NEXUS · UV</span>
	<button id="back" type="button" title="Back" disabled>←</button>
	<button id="forward" type="button" title="Forward" disabled>→</button>
	<button id="reload" type="button" title="Reload" disabled>⟳</button>
	<form id="omni"><input id="address" placeholder="Search or enter a URL" spellcheck="false" autocomplete="off" /></form>
	<span id="status" data-state="starting">Starting…</span>
	<a class="link" href="/index.html">Scramjet</a>
</header>
<main><iframe id="frame" title="Ultraviolet proxied page"></iframe></main>
<div id="banner"></div>

<script src="/uv/uv.bundle.js"></script>
<script src="/uv/uv.config.js"></script>
<script type="module">
	import { BareMuxConnection } from "/baremux.mjs";

	const PREFIX = self.__uv$config.prefix;
	const WISP_SERVERS = [
		"wss://anura.pro/",
		"wss://wisp.mercurywork.shop/",
	];
	const ENGINES = {
		google: "https://www.google.com/search?q=",
		duckduckgo: "https://duckduckgo.com/?q=",
		bing: "https://www.bing.com/search?q=",
		brave: "https://search.brave.com/search?q=",
	};

	const $ = (id) => document.getElementById(id);
	const el = {
		frame: $("frame"), address: $("address"), status: $("status"), banner: $("banner"),
		back: $("back"), forward: $("forward"), reload: $("reload"),
	};

	let ready = false;

	const store = {
		get(key, fallback) {
			try {
				const value = localStorage.getItem("bwnexus." + key);
				return value === null ? fallback : value;
			} catch {
				return fallback;
			}
		},
	};

	function setStatus(state, text) {
		el.status.dataset.state = state;
		el.status.textContent = text;
	}

	function banner(text) {
		el.banner.textContent = text;
		el.banner.classList.add("show");
	}

	function probeWisp(url, timeout = 4500) {
		return new Promise((resolve) => {
			let socket = null, settled = false;
			const finish = (ok) => {
				if (settled) return;
				settled = true;
				clearTimeout(timer);
				try { if (socket) socket.close(); } catch {}
				resolve(ok);
			};
			const timer = setTimeout(() => finish(false), timeout);
			try {
				// No subprotocol: some servers answer 101 without echoing "wisp",
				// and a client that asked for one aborts a handshake that worked.
				socket = new WebSocket(url);
			} catch {
				finish(false);
				return;
			}
			socket.addEventListener("open", () => finish(true), { once: true });
			socket.addEventListener("error", () => finish(false), { once: true });
			socket.addEventListener("close", () => finish(false), { once: true });
		});
	}

	async function pickWisp() {
		const manual = (store.get("wisp", "") || "").trim();
		if (manual) return manual;
		for (const candidate of WISP_SERVERS) {
			if (await probeWisp(candidate)) return candidate;
		}
		return WISP_SERVERS[0];
	}

	function resolveTarget(raw) {
		const value = String(raw || "").trim();
		if (!value) return null;
		if (/^[a-z][a-z0-9+.-]*:\/\//i.test(value)) return value;
		if (/^(localhost|127\.0\.0\.1|\[::1\])(:\d+)?([/?#]|$)/i.test(value)) return "http://" + value;
		if (/^(?!.*\s)([\w-]+\.)+[a-z]{2,}(:\d+)?([/?#].*)?$/i.test(value)) return "https://" + value;
		const engine = ENGINES[store.get("engine", "google")] || ENGINES.google;
		return engine + encodeURIComponent(value);
	}

	function navigate(raw) {
		const url = resolveTarget(raw);
		if (!url) return;
		if (!ready) {
			banner("Ultraviolet is still starting — try again in a second.");
			return;
		}
		el.address.value = url;
		try {
			el.frame.src = PREFIX + self.__uv$config.encodeUrl(url);
		} catch (error) {
			banner("Could not open that page: " + (error && error.message ? error.message : error));
		}
	}

	function syncFromFrame() {
		try {
			const path = el.frame.contentWindow.location.pathname;
			if (!path.startsWith(PREFIX)) return;
			const decoded = self.__uv$config.decodeUrl(path.slice(PREFIX.length));
			if (decoded && document.activeElement !== el.address) el.address.value = decoded;
		} catch {
			/* still loading */
		}
	}

	async function boot() {
		setStatus("starting", "Starting…");

		if (!("serviceWorker" in navigator)) {
			setStatus("offline", "Needs HTTPS");
			banner("Service workers need a secure context. Open BW Nexus over https:// (or localhost).");
			return;
		}
		if (!self.Ultraviolet || !self.__uv$config) {
			setStatus("offline", "Engine missing");
			banner("uv.bundle.js or uv.config.js did not load from /uv/.");
			return;
		}

		try {
			await navigator.serviceWorker.register("/uv/sw.js", { scope: "/uv/" });
			await navigator.serviceWorker.ready;

			const mux = new BareMuxConnection("/mux.js");
			const bare = (store.get("bare", "") || "").trim();

			if (bare) {
				// Bare v3 over plain HTTPS: no Wisp server in the path at all.
				await mux.setTransport("/baremod.mjs", [bare]);
				setStatus("online", "UV · bare");
			} else {
				const wisp = await pickWisp();
				await mux.setTransport("/epoxy.mjs", [{ wisp }]);
				setStatus("online", "UV · wisp");
			}

			ready = true;
			el.back.disabled = false;
			el.forward.disabled = false;
			el.reload.disabled = false;
			el.address.focus({ preventScroll: true });
		} catch (error) {
			console.error("[BW Nexus] ultraviolet boot failed", error);
			setStatus("offline", "Engine offline");
			banner("Ultraviolet could not start: " + (error && error.message ? error.message : error));
		}
	}

	$("omni").addEventListener("submit", (event) => {
		event.preventDefault();
		navigate(el.address.value);
		el.address.blur();
	});
	el.back.addEventListener("click", () => { try { el.frame.contentWindow.history.back(); } catch {} });
	el.forward.addEventListener("click", () => { try { el.frame.contentWindow.history.forward(); } catch {} });
	el.reload.addEventListener("click", () => { try { el.frame.contentWindow.location.reload(); } catch {} });
	el.frame.addEventListener("load", syncFromFrame);

	boot();
</script>
</body>
</html>
